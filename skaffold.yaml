apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: ouistity
build:
  artifacts:
    - image: shokohsc/moleculer-ouistity
      context: .
      sync:
        manual:
          - src: services/**/*.js
            dest: .
          - src: mixins/*.js
            dest: .
      docker:
        dockerfile: Dockerfile
manifests:
  kustomize:
    paths:
      - k8s/base
deploy:
  kubectl: {}
profiles:
  - name: dev
    activation:
      - command: dev
    build:
      artifacts:
        - image: shokohsc/moleculer-ouistity
          sync:
            manual:
              - src: services/**/*.js
                dest: .
              - src: mixins/*.js
                dest: .
  - name: shokohsc
    build:
      artifacts:
        - image: shokohsc/moleculer-ouistity
          sync:
            manual:
              - src: services/**/*.js
                dest: .
              - src: mixins/*.js
                dest: .
          kaniko:
            cache:
              repo: shokohsc/moleculer-ouistity
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
    manifests:
      kustomize:
        paths:
          - k8s/overlays/shokohsc
    deploy:
      kubectl: {}
  - name: prod
    build:
      artifacts:
        - image: shokohsc/moleculer-ouistity
          kaniko:
            cache:
              repo: shokohsc/moleculer-ouistity
            dockerfile: Dockerfile
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi