---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: marvel
spec:
  template:
    spec:
      containers:
        - name: marvel
          image: shokohsc/moleculer-ouistity
          env:
            - name: APP_GLOBAL_GATEWAY_URL
              value: https://api.ouistity.shokohsc.home
          args:
            - --hot
            - services/marvel/*.service.js
